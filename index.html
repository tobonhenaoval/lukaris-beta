<style>
:root{--bg:#f4f6f8;--ink:#17212b;--muted:#718096;--line:#e5eaf0;--brand:#165d52;--soft:#e6f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:235px;background:#122b2a;color:white;padding:24px 15px;flex-shrink:0}.logo{font-size:21px;font-weight:800;padding:0 10px}.logo span{color:#79c7b2}.tag{font-size:12px;color:#a9c2bd;padding:4px 10px 24px}.navlabel{font-size:10px;letter-spacing:1px;color:#88a7a0;padding:12px 10px 6px;text-transform:uppercase}.nav button{display:block;width:100%;border:0;background:transparent;color:#c5d5d1;padding:11px 12px;border-radius:9px;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#244541;color:#fff}.sidefoot{position:fixed;bottom:18px;color:#9bb5af;font-size:11px;padding:0 10px}.main{flex:1;min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px}.crumb{font-size:13px;color:var(--muted)}.bizname{font-weight:650}.content{max-width:1350px;margin:auto;padding:28px 30px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--brand);font-weight:750;font-size:11px;letter-spacing:1px;text-transform:uppercase}.h1{font-size:28px;letter-spacing:-.7px;margin:4px 0}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;font-weight:650}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.sm{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px}.card{margin-bottom:16px}.card h3{font-size:16px;margin:0 0 4px}.desc{font-size:12px;color:var(--muted);margin:0 0 14px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:white;color:var(--ink)}.search{min-width:220px;flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{font-size:13px;padding:12px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#edf1f5;color:#536170}.ok{background:#e4f4ed;color:#17664f}.wait{background:#fff3dc;color:#946200}.notice{padding:12px;background:#fff8e8;color:#785a19;border:1px solid #f2dfb7;border-radius:9px;font-size:12px;margin-top:12px}.empty{text-align:center;padding:25px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{border:1px solid var(--line);background:white;border-radius:9px;padding:12px;text-align:left}.quick b{display:block;font-size:12px;margin-top:5px}.modalback{position:fixed;inset:0;background:#071b1a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.show{display:flex}.modal{background:white;width:min(540px,100%);padding:22px;border-radius:15px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;margin-bottom:16px}.modalhead h2{font-size:19px;margin:0}.x{border:0;border-radius:7px;padding:6px 10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#53616b}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;font-weight:400}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.money{font-variant-numeric:tabular-nums}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.module-option{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px}.module-option input{margin-top:3px}.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.plan{border:1px solid var(--line);border-radius:10px;padding:13px}.plan strong{display:block;font-size:18px;margin:6px 0}.plan small{color:var(--muted)}.inline-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.unit-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.unit-row:last-child{border:0}@media(max-width:850px){.plan-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.module-grid{grid-template-columns:1fr 1fr}.plan-grid{grid-template-columns:1fr 1fr}}
@media(max-width:850px){.side{width:195px}.content{padding:22px 18px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.shell{display:block}.side{width:100%;padding:12px;position:sticky;top:0;z-index:3}.logo{padding:0 5px}.tag,.navlabel,.sidefoot{display:none}.nav{display:flex;overflow:auto;gap:3px;margin-top:9px}.nav button{white-space:nowrap;width:auto;padding:8px 10px;font-size:12px}.top{height:48px;padding:0 15px}.content{padding:20px 13px}.h1{font-size:23px}.heading{align-items:center}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{min-width:0}}
</style></head><body><div class="shell">
<aside class="side"><div class="logo">LUKARIS</div><div class="tag">Una plataforma para negocios de todo tipo</div><div class="navlabel">Gestión</div><nav class="nav" id="nav">
<button data-page="home" class="active">⌂ Resumen</button><button data-page="appointments">▦ Agenda</button><button data-page="clients">♙ Clientes</button><button data-page="cash">$ Caja y ventas</button><button data-page="services">✦ Servicios</button><button data-page="inventory">▤ Inventario</button><button data-page="work">▧ Operaciones</button><button data-page="settings">⚙ Configuración</button></nav><div class="sidefoot">Beta 0.3 · Modo local</div></aside>
<main class="main"><header class="top"><div class="crumb">LUKARIS / <span id="crumb">Resumen</span></div><div class="bizname" id="topbiz">Mi negocio</div></header><div class="content" id="app"></div></main></div>
<div class="modalback" id="back"><section class="modal"><div class="modalhead"><h2 id="mtitle">Nuevo registro</h2><button class="x" onclick="closeModal()">✕</button></div><div id="mbody"></div></section></div>
<script>
const KEY='lukaris-beta-v02';
const day=()=>new Date().toISOString().slice(0,10);
const addDay=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const initial={profile:{name:'Mi negocio',type:'services',currency:'COP',country:'',language:'es',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',accountMode:'both',onboarded:false,modules:[]},organizationUnits:[{id:1,name:'Mi negocio',kind:'business',parentId:null,country:''}],clients:[{id:1,name:'Alex Rivera',phone:'300 555 0101',email:'alex@example.com'},{id:2,name:'María Torres',phone:'310 555 0182',email:'maria@example.com'}],services:[{id:1,name:'Servicio inicial',price:30000,duration:30},{id:2,name:'Servicio estándar',price:45000,duration:50}],appointments:[{id:1,clientId:1,serviceId:2,date:day(),time:'10:00',status:'Confirmada',price:45000}],payments:[{id:1,clientId:1,description:'Servicio estándar',amount:45000,date:day(),method:'Efectivo'}],products:[{id:1,name:'Producto de muestra',sku:'SKU-001',stock:8,cost:12000,price:22000}],orders:[{id:1,clientId:2,vehicle:'Pedido #1001',detail:'Preparación y entrega de pedido',date:day(),status:'En proceso',amount:85000}]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}
if(!db.profile)db.profile={name:'Mi negocio',type:'services',currency:'COP'};Object.assign(db.profile,{language:'es',accountMode:'both',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'},db.profile);if(!Array.isArray(db.organizationUnits))db.organizationUnits=[{id:1,name:db.profile.name||'Mi negocio',kind:'business',parentId:null,country:db.profile.country||''}];if(!Array.isArray(db.profile.modules))db.profile.modules=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)), money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:db.profile.currency||'COP',maximumFractionDigits:0}).format(+n||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const client=id=>db.clients.find(x=>x.id==id)?.name||'Cliente';const service=id=>db.services.find(x=>x.id==id)?.name||'Servicio';
let page='home';
const titles={home:'Resumen',appointments:'Agenda',clients:'Clientes',cash:'Caja y ventas',services:'Servicios',inventory:'Inventario',work:'Operaciones',settings:'Configuración'};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=titles[p];render()}
function head(k,t,s,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1 class="h1">${t}</h1><p class="sub">${s}</p></div>${action}</div>`}
function button(t,fn){return `<button class="btn primary" onclick="${fn}">${t}</button>`}
function render(){document.getElementById('topbiz').textContent=db.profile.name;({home,appointments,clients,cash,services,inventory,work,settings}[page])()}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Todavía no hay registros.</td></tr>`}</tbody></table></div>`}
function home(){
let todayApps=db.appointments.filter(a=>a.date===day()).length, income=db.payments.filter(p=>p.date===day()).reduce((s,p)=>s+p.amount,0);
document.getElementById('app').innerHTML=head('Panel de control','Bienvenido a LUKARIS','Vista general de la operación de tu negocio.',button('+ Nuevo registro',"openForm('appointment')"))+
`<div class="stats"><div class="stat"><small>Citas de hoy</small><strong>${todayApps}</strong></div><div class="stat"><small>Ingresos de hoy</small><strong>${money(income)}</strong></div><div class="stat"><small>Clientes registrados</small><strong>${db.clients.length}</strong></div><div class="stat"><small>Productos en inventario</small><strong>${db.products.length}</strong></div></div>
<div class="grid2"><section class="card"><h3>Actividad reciente</h3><p class="desc">Citas y órdenes de trabajo</p>${table(['Fecha','Cliente','Detalle','Estado'],[...db.appointments.map(a=>`<tr><td>${a.date}</td><td>${client(a.clientId)}</td><td>${service(a.serviceId)}</td><td><span class="pill ok">${a.status}</span></td>`),...db.orders.map(o=>`<tr><td>${o.date}</td><td>${client(o.clientId)}</td><td>${esc(o.detail)}</td><td><span class="pill wait">${o.status}</span></td>`)].slice(0,6).join(''))}</section>
<section class="card"><h3>Módulos del sistema</h3><p class="desc">Un núcleo adaptable a distintas verticales</p><div class="quick"><button onclick="go('appointments')">▦<b>Agenda</b></button><button onclick="go('cash')">$<b>Ventas y caja</b></button><button onclick="go('inventory')">▤<b>Inventario</b></button><button onclick="go('work')">▧<b>Operaciones</b></button><button onclick="go('clients')">♙<b>Clientes</b></button><button onclick="go('services')">✦<b>Servicios</b></button></div><div class="notice">Beta local: la información se guarda en este navegador. No hay sincronización ni copias de seguridad automáticas.</div></section></div>`;
}
function appointments(){document.getElementById('app').innerHTML=head('Programación','Agenda','Citas, reservas y reuniones de cualquier negocio.',button('+ Nueva cita',"openForm('appointment')"))+`<section class="card">${table(['Fecha','Hora','Cliente','Servicio','Estado'],db.appointments.map(a=>`<tr><td>${a.date}</td><td>${a.time}</td><td>${client(a.clientId)}</td><td>${service(a.serviceId)}</td><td><span class="pill ${a.status==='Confirmada'?'ok':'wait'}">${a.status}</span></td></tr>`).join(''))}</section>`}
function clients(){document.getElementById('app').innerHTML=head('Relaciones','Clientes','Base central de clientes para cualquier actividad comercial.',button('+ Nuevo cliente',"openForm('client')"))+`<section class="card">${table(['Nombre','Teléfono','Correo'],db.clients.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email||'—')}</td></tr>`).join(''))}</section>`}
function cash(){let sum=db.payments.reduce((s,p)=>s+p.amount,0);document.getElementById('app').innerHTML=head('Finanzas','Caja y ventas','Registro básico de cobros, ventas y movimientos.',button('+ Registrar venta / pago',"openForm('payment')"))+`<div class="stats"><div class="stat"><small>Ingresos acumulados</small><strong>${money(sum)}</strong></div><div class="stat"><small>Transacciones</small><strong>${db.payments.length}</strong></div><div class="stat"><small>Deudas registradas</small><strong>0</strong></div><div class="stat"><small>Moneda</small><strong>${db.profile.currency}</strong></div></div><section class="card">${table(['Fecha','Cliente','Concepto','Método','Valor'],db.payments.map(p=>`<tr><td>${p.date}</td><td>${client(p.clientId)}</td><td>${esc(p.description)}</td><td>${p.method}</td><td><b>${money(p.amount)}</b></td></tr>`).join(''))}</section>`}
function services(){document.getElementById('app').innerHTML=head('Catálogo','Servicios','Productos y servicios que ofrece el negocio.',button('+ Nuevo servicio',"openForm('service')"))+`<section class="card">${table(['Servicio','Duración','Precio'],db.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.duration} min</td><td>${money(s.price)}</td></tr>`).join(''))}</section>`}
function inventory(){document.getElementById('app').innerHTML=head('Productos','Inventario','Control inicial de productos, existencias y precios.',button('+ Agregar producto',"openForm('product')"))+`<section class="card">${table(['Producto','SKU','Existencias','Costo','Precio venta'],db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku)}</td><td><span class="pill ${p.stock<5?'wait':'ok'}">${p.stock}</span></td><td>${money(p.cost)}</td><td>${money(p.price)}</td></tr>`).join(''))}</section>`}
function work(){document.getElementById('app').innerHTML=head('Operaciones','Operaciones','Registra trabajos, proyectos, pedidos o solicitudes según tu actividad.',button('+ Nueva orden',"openForm('order')"))+`<section class="card">${table(['Fecha','Cliente','Referencia','Trabajo','Estado','Valor'],db.orders.map(o=>`<tr><td>${o.date}</td><td>${client(o.clientId)}</td><td>${esc(o.vehicle)}</td><td>${esc(o.detail)}</td><td><span class="pill wait">${o.status}</span></td><td>${money(o.amount)}</td></tr>`).join(''))}</section>`}
const moduleCatalog=[
 ['crm','Clientes y CRM'],['agenda','Agenda y reservas'],['sales','Ventas y pedidos'],['cash','Caja y finanzas'],['inventory','Inventario'],['services','Productos y servicios'],['operations','Operaciones y proyectos'],['team','Equipo y permisos'],['subscriptions','Suscripciones'],['marketing','Marketing y fidelización'],['reports','Reportes y analítica']
];
const recommendedByType={
 retail:['crm','sales','cash','inventory','reports'],
 services:['crm','agenda','services','cash','reports'],
 food:['crm','agenda','sales','cash','inventory','reports'],
 health:['crm','agenda','services','cash','reports'],
 education:['crm','agenda','services','cash','reports'],
 construction:['crm','sales','cash','inventory','operations','team','reports'],
 automotive:['crm','agenda','services','cash','inventory','operations','reports'],
 logistics:['crm','sales','inventory','operations','team','reports'],
 hospitality:['crm','agenda','sales','cash','operations','reports'],
 digital:['crm','sales','subscriptions','marketing','reports'],
 other:['crm','sales','cash','operations','reports']
};
function recommendedModules(){return recommendedByType[db.profile.type]||recommendedByType.other}
function toggleModule(id,checked){let set=new Set(db.profile.modules.length?db.profile.modules:recommendedModules());checked?set.add(id):set.delete(id);db.profile.modules=[...set];save();render()}
function addUnit(){
 let name=prompt('Nombre de la empresa o sucursal:');if(!name||!name.trim())return;
 let kind=confirm('¿Es una sucursal de una empresa existente?\\nAceptar = sucursal · Cancelar = empresa independiente')?'branch':'business';
 let parentId=null;
 if(kind==='branch'){let parents=db.organizationUnits.filter(x=>x.kind==='business');if(!parents.length){alert('Primero agrega una empresa principal.');return;}let list=parents.map((x,i)=>`${i+1}. ${x.name}`).join('\\n');let pick=Number(prompt('Escribe el número de la empresa principal:\\n'+list,'1'));if(!pick||!parents[pick-1])return;parentId=parents[pick-1].id;}
 db.organizationUnits.push({id:Date.now(),name:name.trim(),kind,parentId,country:db.profile.country||''});save();render();
}
function exportBackup(){
 const payload={app:'LUKARIS',schemaVersion:1,exportedAt:new Date().toISOString(),data:db};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lukaris-respaldo-'+day()+'.json';a.click();URL.revokeObjectURL(url);
}
function importBackup(input){
 const file=input.files&&input.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{
   const parsed=JSON.parse(reader.result),candidate=parsed.data;
   const required=['profile','clients','services','appointments','payments','products','orders'];
   if(parsed.app!=='LUKARIS'||!candidate||!required.every(k=>Array.isArray(candidate[k])||k==='profile'&&typeof candidate[k]==='object'))throw new Error('El archivo no tiene la estructura de respaldo LUKARIS.');
   if(!confirm('Esto reemplazará los datos actuales de este navegador. ¿Deseas continuar?'))return;
   db=candidate;if(!Array.isArray(db.organizationUnits))db.organizationUnits=[{id:Date.now(),name:db.profile.name||'Mi negocio',kind:'business',parentId:null,country:db.profile.country||''}];
   if(!Array.isArray(db.profile.modules))db.profile.modules=recommendedModules();
   save();alert('Respaldo restaurado correctamente.');render();
 }catch(err){alert('No se pudo importar el respaldo: '+err.message)}finally{input.value=''}};
 reader.readAsText(file);
}
function settings(){
 const rec=recommendedModules(),active=new Set(db.profile.modules.length?db.profile.modules:rec);
 const units=db.organizationUnits||[];
 document.getElementById('app').innerHTML=head('Administración global','Configuración de LUKARIS','Adapta la plataforma a la actividad, estructura y mercado de cada organización.')+
 `<section class="card"><h3>1. Configuración adaptativa del negocio</h3><p class="desc">LUKARIS recomienda módulos según la actividad seleccionada. Puedes activar o desactivar cada módulo.</p>
 <form onsubmit="saveProfile(event)"><div class="formgrid">
 <label class="field">Nombre del negocio<input name="name" required value="${esc(db.profile.name)}"></label>
 <label class="field">Actividad principal<select name="type">
 ${[['retail','Comercio y retail'],['services','Servicios profesionales'],['food','Alimentos y restaurantes'],['health','Salud y bienestar'],['education','Educación'],['construction','Construcción e instalaciones'],['automotive','Automoción y mantenimiento'],['logistics','Logística y transporte'],['hospitality','Turismo y alojamiento'],['digital','Negocios digitales y suscripciones'],['other','Otra actividad']].map(([v,l])=>`<option value="${v}" ${db.profile.type===v?'selected':''}>${l}</option>`).join('')}
 </select></label>
 <label class="field">País<input name="country" value="${esc(db.profile.country||'')}" placeholder="País de operación"></label>
 <label class="field">Moneda principal<select name="currency">${[['COP','COP · Peso colombiano'],['USD','USD · Dólar estadounidense'],['EUR','EUR · Euro'],['GBP','GBP · Libra esterlina'],['MXN','MXN · Peso mexicano'],['PEN','PEN · Sol peruano'],['CLP','CLP · Peso chileno'],['ARS','ARS · Peso argentino'],['BRL','BRL · Real brasileño']].map(([v,l])=>`<option value="${v}" ${db.profile.currency===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="field">Idioma preferido<select name="language">${[['es','Español'],['en','English'],['pt','Português'],['fr','Français']].map(([v,l])=>`<option value="${v}" ${db.profile.language===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <label class="field">Zona horaria<input name="timezone" value="${esc(db.profile.timezone||'UTC')}" placeholder="Ej. America/Bogota"></label>
 <label class="field">Estructura de administración<select name="accountMode"><option value="single" ${db.profile.accountMode==='single'?'selected':''}>Una empresa</option><option value="group" ${db.profile.accountMode==='group'?'selected':''}>Grupo de empresas</option><option value="both" ${!db.profile.accountMode||db.profile.accountMode==='both'?'selected':''}>Ambas modalidades</option></select></label>
 </div><div class="actions"><button class="btn primary">Guardar perfil</button></div></form>
 <div style="margin-top:16px"><b style="font-size:13px">Módulos recomendados para esta actividad</b><div class="module-grid" style="margin-top:9px">${moduleCatalog.map(([id,label])=>`<label class="module-option"><input type="checkbox" ${active.has(id)?'checked':''} onchange="toggleModule('${id}',this.checked)"><span>${label}${rec.includes(id)?' <span class="pill ok">Recomendado</span>':''}</span></label>`).join('')}</div></div>
 <div class="notice">El onboarding adaptativo está definido en esta beta como recomendación de módulos por sector. La configuración no bloquea otros sectores ni limita la personalización.</div></section>
 <section class="card"><h3>2. Empresas y sucursales</h3><p class="desc">La cuenta puede operar una sola empresa o administrar un grupo con varias empresas y sucursales.</p>
 ${units.map(u=>`<div class="unit-row"><div><b>${esc(u.name)}</b><div class="desc" style="margin:2px 0 0">${u.kind==='branch'?'Sucursal de '+esc(units.find(x=>x.id===u.parentId)?.name||'empresa'):'Empresa independiente'}</div></div><span class="pill">${u.kind==='branch'?'Sucursal':'Empresa'}</span></div>`).join('')||'<p class="empty">Todavía no hay empresas registradas.</p>'}
 <div class="inline-actions"><button class="btn" onclick="addUnit()">+ Agregar empresa o sucursal</button></div>
 <div class="notice">En esta versión, las unidades se guardan localmente como estructura de referencia. El acceso simultáneo, aislamiento de datos y permisos por empresa/sucursal requieren backend multiempresa.</div></section>

function openForm(type){let clientsOpt=db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''),servicesOpt=db.services.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}</option>`).join('');
let forms={
client:['Nuevo cliente',`<form onsubmit="submit(event,'client')"><div class="formgrid"><label class="field full">Nombre<input name="name" required></label><label class="field">Teléfono<input name="phone" required></label><label class="field">Correo<input name="email" type="email"></label></div>${actions('Guardar cliente')}</form>`],
service:['Nuevo servicio',`<form onsubmit="submit(event,'service')"><div class="formgrid"><label class="field full">Nombre<input name="name" required></label><label class="field">Precio<input name="price" type="number" min="0" required></label><label class="field">Duración (min)<input name="duration" type="number" value="30" min="5" required></label></div>${actions('Guardar servicio')}</form>`],
appointment:['Nueva cita',`<form onsubmit="submit(event,'appointment')"><div class="formgrid"><label class="field full">Cliente<select name="clientId">${clientsOpt}</select></label><label class="field full">Servicio<select name="serviceId">${servicesOpt}</select></label><label class="field">Fecha<input name="date" type="date" value="${day()}" required></label><label class="field">Hora<input name="time" type="time" value="09:00" required></label><label class="field">Estado<select name="status"><option>Confirmada</option><option>Pendiente</option><option>Atendida</option><option>Cancelada</option></select></label><label class="field">Valor<input name="price" type="number" min="0" value="${db.services[0]?.price||0}" required></label></div>${actions('Guardar cita')}</form>`],
payment:['Registrar venta / pago',`<form onsubmit="submit(event,'payment')"><div class="formgrid"><label class="field full">Cliente<select name="clientId">${clientsOpt}</select></label><label class="field full">Concepto<input name="description" required></label><label class="field">Valor<input name="amount" type="number" min="1" required></label><label class="field">Fecha<input name="date" type="date" value="${day()}" required></label><label class="field full">Método<select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></label></div>${actions('Guardar movimiento')}</form>`],
product:['Agregar producto',`<form onsubmit="submit(event,'product')"><div class="formgrid"><label class="field full">Nombre<input name="name" required></label><label class="field">SKU / código<input name="sku"></label><label class="field">Existencias<input name="stock" type="number" min="0" value="0"></label><label class="field">Costo<input name="cost" type="number" min="0" value="0"></label><label class="field">Precio venta<input name="price" type="number" min="0" value="0"></label></div>${actions('Guardar producto')}</form>`],
order:['Nueva operación',`<form onsubmit="submit(event,'order')"><div class="formgrid"><label class="field full">Cliente<select name="clientId">${clientsOpt}</select></label><label class="field full">Referencia / activo<input name="vehicle" required placeholder="Código, equipo, pedido o referencia"></label><label class="field full">Trabajo solicitado<textarea name="detail" rows="2" required></textarea></label><label class="field">Fecha<input name="date" type="date" value="${day()}" required></label><label class="field">Valor estimado<input name="amount" type="number" min="0" required></label><label class="field full">Estado<select name="status"><option>Recibido</option><option>En proceso</option><option>Esperando repuesto</option><option>Listo para entregar</option><option>Entregado</option></select></label></div>${actions('Guardar operación')}</form>`]
};
document.getElementById('mtitle').textContent=forms[type][0];document.getElementById('mbody').innerHTML=forms[type][1];document.getElementById('back').classList.add('show')}
function actions(label){return `<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">${label}</button></div>`}
function closeModal(){document.getElementById('back').classList.remove('show')}
function submit(e,type){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries()),id=Date.now();
if(type==='client')db.clients.push({id,...f});
if(type==='service')db.services.push({id,...f,price:+f.price,duration:+f.duration});
if(type==='appointment')db.appointments.push({id,...f,clientId:+f.clientId,serviceId:+f.serviceId,price:+f.price});
if(type==='payment')db.payments.push({id,...f,clientId:+f.clientId,amount:+f.amount});
if(type==='product')db.products.push({id,...f,stock:+f.stock,cost:+f.cost,price:+f.price});
if(type==='order')db.orders.push({id,...f,clientId:+f.clientId,amount:+f.amount});
save();closeModal();render()}
function saveProfile(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());f.onboarded=true;f.modules=db.profile.modules?.length?db.profile.modules:recommendedByType[f.type]||recommendedByType.other;db.profile={...db.profile,...f};if(db.organizationUnits?.length===1&&db.organizationUnits[0].name==='Mi negocio')db.organizationUnits[0].name=f.name;save();render()}
document.getElementById('back').addEventListener('click',e=>{if(e.target.id==='back')closeModal()});render();
</script></body></html>
